<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apprends à lire l’arabe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#F3F6FB;--card:#fff;--ink:#1D2A44;--mut:#5B6785;--line:#D6DFEE;--o:#D9691A;--g:#17876A;--b:#3568CF;--p:#7C4DDB;--gold:#F2B63D;--ok:#17876A;--ko:#CF3C34;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1629;--card:#18223D;--ink:#EAF0FF;--mut:#9BA9C8;--line:#2B3858;--o:#F0954E;--g:#3CC49E;--b:#6F9DFF;--p:#A98BF6;--ok:#3CC49E;--ko:#FF7A72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1629;--card:#18223D;--ink:#EAF0FF;--mut:#9BA9C8;--line:#2B3858;--o:#F0954E;--g:#3CC49E;--b:#6F9DFF;--p:#A98BF6;--ok:#3CC49E;--ko:#FF7A72;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:500 16px/1.4 Fredoka,system-ui,sans-serif;min-height:100%}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:26px;line-height:1.15;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;padding:10px;border-radius:12px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
button{font-family:inherit}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;line-height:1.7}
.slots{display:flex;direction:rtl;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.slot{position:relative;width:96px;height:112px;border:3px solid var(--c);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--c);font-size:58px;display:grid;place-items:center;cursor:pointer;color:var(--c);padding:0}
.slot[aria-pressed=true]{background:color-mix(in srgb,var(--c) 14%,var(--card));transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.slot i{position:absolute;top:2px;left:6px;font:700 15px Fredoka;color:var(--mut);font-style:normal}
.pal{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.pal button{min-width:58px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:2px 8px;font-size:30px;cursor:pointer;line-height:1.5}
.pal button[aria-pressed=true]{border-color:var(--ink);background:var(--gold);color:#1D2A44}
.pal small{display:block;font:600 11px Fredoka;color:inherit;line-height:1;padding-bottom:5px}
.word{direction:rtl;text-align:center;font-size:84px;min-height:132px;margin:4px 0}
.word span{transition:color .2s}.word span.on{background:color-mix(in srgb,var(--gold) 55%,transparent);border-radius:12px}
.tr{text-align:center;color:var(--mut);font-weight:700;min-height:24px;margin-bottom:10px;letter-spacing:.02em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 10px;font-weight:700;font-size:15px;cursor:pointer}
.btn.main{background:var(--ink);color:var(--bg)}.btn.wide{grid-column:1/-1;width:100%}
.letters{display:grid;grid-template-columns:repeat(7,1fr);direction:rtl;gap:6px;margin-top:10px}
.letters button{aspect-ratio:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:400 30px Amiri,serif;cursor:pointer;padding:0}
h2{font-size:15px;color:var(--mut);margin:16px 0 4px;font-weight:700}
.lv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.lv b{display:block;font-size:17px}.lv span{color:var(--mut);font-size:14px}.lv .ex{margin-left:auto;font-size:30px;color:var(--c)}.lv .st{display:block;color:var(--gold);letter-spacing:2px;font-size:16px}
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;text-align:center}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.q .word{font-size:92px}.ch{display:grid;gap:8px;margin-top:8px}
.ch button{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:14px;font-size:20px;font-weight:700;cursor:pointer}
.ch button.ok{background:var(--ok);border-color:var(--ok);color:#fff}.ch button.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.end{font-size:56px;color:var(--gold);letter-spacing:6px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>Apprends à lire l’arabe</h1><p class="sub">Méthode Qaïda Nourania, pas à pas</p>
<div class="tabs" role="tablist"><button role="tab" id="t1" aria-selected="true">Laboratoire</button><button role="tab" id="t2" aria-selected="false">Niveaux</button></div>

<section id="lab">
 <div class="slots" id="slots"></div>
 <div class="pal" id="pal"></div>
 <div class="word ar" id="word" aria-live="polite"></div><div class="tr" id="tr"></div>
 <div class="row"><button class="btn main" id="play">▶ Lire le mot</button><button class="btn" id="syl">Syllabe par syllabe</button>
 <button class="btn" id="rnd">Au hasard</button><button class="btn" id="clr">Effacer</button></div>
 <h2>Touchez une lettre pour l’ajouter (4 maximum)</h2><div class="letters" id="letters"></div>
</section>

<section id="lvls" hidden><div id="list"></div></section>

<section id="quiz" hidden>
 <div class="row" style="grid-template-columns:auto 1fr;align-items:center"><button class="btn" id="back">← Niveaux</button><b id="qt" style="text-align:right"></b></div>
 <div class="bar"><i id="pb"></i></div>
 <div class="q" id="qb"></div>
</section></main><div class="toast" id="toast" hidden></div>
<script>
const H={fa:"\u064E",ki:"\u0650",da:"\u064F",fat:"\u064B",kit:"\u064D",dat:"\u064C",suk:"\u0652",sh:"\u0651"};
const NAMES=[["fa","Fatha"],["ki","Kasra"],["da","Damma"],["fat","Fathatayn"],["kit","Kasratayn"],["dat","Dammatayn"],["suk","Soukoun"],["sh","Chadda"]];
const LET=[..."ابتثجحخدذرزسشصضطظعغفقكلمنهوي"];
const COL=["var(--o)","var(--g)","var(--b)","var(--p)"];
const TR={"ا":"","أ":"'","إ":"'","ء":"'","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r","ز":"z","س":"s","ش":"ch","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"'","غ":"gh","ف":"f","ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y"};
const VW={"\u064E":"a","\u0650":"i","\u064F":"ou","\u064B":"an","\u064D":"in","\u064C":"oun"};
const LONG={a:"â",i:"î",ou:"oû"};
function translit(w){
  const P=[];
  for(let i=0;i<w.length;i++){
    const c=w[i];if(!(c in TR))continue;
    let d="";while(i+1<w.length&&!(w[i+1] in TR)){d+=w[++i]}
    const v=[...d].map(x=>VW[x]).find(Boolean)||"",s=d.includes(H.suk),sh=d.includes(H.sh),p=P[P.length-1];
    if(!v&&!s&&!sh&&p&&"اوي".includes(c)){
      if(c==="ا"&&p.v==="an")continue;
      if((c==="ا"&&p.v==="a")||(c==="و"&&p.v==="ou")||(c==="ي"&&p.v==="i")){p.v=LONG[p.v];continue}
    }
    P.push({k:TR[c]+(sh?TR[c]:""),v});
  }
  return P.reduce((o,x,i)=>o+(x.v?(i?"-":"")+x.k+x.v:x.k),"").replace(/^-/,"");
}
let voice=null;
function speak(t){return new Promise(r=>{
  if(!("speechSynthesis"in window)){toast("Le son n’est pas disponible sur cet appareil.");return r()}
  const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.65;
  voice=voice||speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith("ar"));
  if(voice)u.voice=voice;else if(!speak.w){speak.w=1;toast("Aucune voix arabe trouvée : installez-en une dans les réglages de l’appareil.")}
  u.onend=u.onerror=()=>r();speechSynthesis.cancel();speechSynthesis.speak(u)})}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,3500)}
const $=id=>document.getElementById(id);

/* ---- Laboratoire ---- */
let slots=[{l:"ج",h:H.fa,s:0},{l:"م",h:H.fa,s:0},{l:"ل",h:H.da,s:0}],act=0;
const txt=s=>s.l+(s.s?H.sh:"")+s.h;
function render(){
  $("slots").innerHTML="";
  slots.forEach((s,i)=>{const b=document.createElement("button");b.className="slot ar";b.style.setProperty("--c",COL[i]);
    b.setAttribute("aria-pressed",i===act);b.setAttribute("aria-label","Lettre "+(i+1));b.innerHTML=txt(s)+"<i>"+(i+1)+"</i>";
    b.onclick=()=>{act=i;render()};b.ondblclick=()=>{slots.splice(i,1);act=Math.max(0,Math.min(act,slots.length-1));render()};$("slots").append(b)});
  $("pal").innerHTML="";
  NAMES.forEach(([k,n])=>{const b=document.createElement("button");const s=slots[act],on=s&&(k==="sh"?s.s:s.h===H[k]);
    b.className="ar";b.setAttribute("aria-pressed",!!on);b.innerHTML="ـ"+H[k]+"<small>"+n+"</small>";
    b.onclick=()=>{if(!s)return;if(k==="sh")s.s=s.s?0:1;else s.h=s.h===H[k]?"":H[k];render()};$("pal").append(b)});
  $("word").innerHTML=slots.map((s,i)=>`<span style="color:${COL[i]}">${txt(s)}</span>`).join("");
  $("tr").textContent=slots.length?translit(slots.map(txt).join("")):"Ajoutez une lettre ci-dessous";
}
$("letters").innerHTML=LET.map(l=>`<button aria-label="Lettre ${l}">${l}</button>`).join("");
[...$("letters").children].forEach((b,i)=>b.onclick=()=>{if(slots.length>=4)return toast("Quatre lettres maximum. Double-touchez une lettre pour la retirer.");
  slots.push({l:LET[i],h:H.fa,s:0});act=slots.length-1;render();speak(LET[i]+H.fa)});
$("play").onclick=()=>speak(slots.map(txt).join(""));
$("syl").onclick=async()=>{const sp=[...$("word").children];for(let i=0;i<slots.length;i++){sp[i]&&sp[i].classList.add("on");await speak(txt(slots[i]));sp[i]&&sp[i].classList.remove("on")}};
$("clr").onclick=()=>{slots=[];act=0;render()};
$("rnd").onclick=()=>{const n=2+Math.floor(Math.random()*3),hs=[H.fa,H.ki,H.da];
  slots=Array.from({length:n},()=>({l:LET[Math.floor(Math.random()*28)],h:hs[Math.floor(Math.random()*3)],s:0}));act=0;render()};

/* ---- Niveaux ---- */
const LV=[
 {t:"Mots de 2 lettres",d:"Fatha, kasra, damma",c:0,w:"أَبُ أَخُ يَدُ دَمُ فَمُ لَكَ لَهُ بِهِ مَعَ بِكَ"},
 {t:"Mots de 3 lettres",d:"Fatha, kasra, damma",c:1,w:"جَمَلُ قَمَرُ شَجَرُ وَلَدُ سَمَكُ حَجَرُ عِنَبُ نَمِرُ كَتَبَ ذَهَبَ فَتَحَ رَسَمَ"},
 {t:"Le tanwîn",d:"Fathatayn, kasratayn, dammatayn",c:2,w:"وَلَدٌ قَمَرٌ حَجَرٌ شَجَرٍ نَمِرٍ وَلَدٍ وَلَدًا قَمَرًا جَمَلًا سَمَكًا"},
 {t:"Les prolongations (madd)",d:"Alif, wâw et yâ qui allongent",c:3,w:"بَابُ دَارُ نَارُ جَارُ قَالَ نُورُ ثُومُ فُولُ فِيلُ تِينُ ذِيبُ طِينُ"},
 {t:"Le soukoun",d:"La lettre sans voyelle",c:0,w:"مِنْ عَنْ هَلْ لَمْ كَمْ قَدْ بَلْ كَلْبُ قَلْبُ شَمْسُ بَحْرُ نَهْرُ بَيْتُ لَيْلُ"},
 {t:"La chadda",d:"La lettre qu’on double",c:1,w:"رَبُّ جَدُّ أُمُّ عَمُّ دُبُّ حُبُّ كُلُّ ثُمَّ إِنَّ سِنُّ حَجُّ فَرَّ"},
 {t:"Mots de 4 lettres et plus",d:"Tout mélanger",c:2,w:"كِتَابُ مَكْتَبُ مَلْعَبُ مَطْبَخُ دَفْتَرُ بُسْتَانُ"}];
LV.forEach(l=>l.w=l.w.split(" "));
let prog={};try{prog=JSON.parse(localStorage.getItem("qn-stars")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("qn-stars",JSON.stringify(prog))}catch(e){}};
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
function list(){$("list").innerHTML="";LV.forEach((l,i)=>{const b=document.createElement("button");b.className="lv";b.style.setProperty("--c",COL[l.c]);
  b.innerHTML=`<div><b>Niveau ${i+1} : ${l.t}</b><span>${l.d}</span><span class="st">${stars(prog[i]||0)}</span></div><div class="ex ar">${l.w[0]}</div>`;
  b.onclick=()=>start(i);$("list").append(b)})}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function wrong(w,n){const idx=[...w].map((c,i)=>[H.fa,H.ki,H.da].includes(c)?i:-1).filter(i=>i>=0),out=new Set(),t0=translit(w);
  for(let k=0;k<30&&out.size<n;k++){const a=[...w],i=idx[Math.floor(Math.random()*idx.length)],o=[H.fa,H.ki,H.da].filter(x=>x!==a[i]);a[i]=o[Math.floor(Math.random()*2)];
    const t=translit(a.join(""));if(t!==t0)out.add(t)}return[...out]}
let R=null;
function start(i){R={i,q:shuf(LV[i].w).slice(0,8),n:0,ok:0};show("quiz");$("qt").textContent="Niveau "+(i+1)+" : "+LV[i].t;ask()}
function ask(){
  if(R.n>=R.q.length){const s=R.ok>=R.q.length-1?3:R.ok>=R.q.length*.6?2:R.ok>=R.q.length*.3?1:0;
    prog[R.i]=Math.max(prog[R.i]||0,s);save();$("pb").style.width="100%";
    $("qb").innerHTML=`<div class="end">${stars(s)}</div><p><b>${R.ok} bonnes réponses sur ${R.q.length}</b></p><div class="row"><button class="btn main" id="again">Rejouer</button><button class="btn" id="nx">${R.i<LV.length-1?"Niveau suivant":"Retour aux niveaux"}</button></div>`;
    $("again").onclick=()=>start(R.i);$("nx").onclick=()=>R.i<LV.length-1?start(R.i+1):show("lvls");return}
  const w=R.q[R.n],good=translit(w),ch=shuf([good,...wrong(w,2)]);$("pb").style.width=R.n/R.q.length*100+"%";
  $("qb").innerHTML=`<div class="word ar">${w}</div><button class="btn" id="snd">🔊 Écouter</button><div class="ch">${ch.map(c=>`<button>${c}</button>`).join("")}</div><p id="fb" style="min-height:24px;font-weight:700"></p>`;
  $("snd").onclick=()=>speak(w);
  [...document.querySelectorAll(".ch button")].forEach(b=>b.onclick=()=>{const okk=b.textContent===good;
    document.querySelectorAll(".ch button").forEach(x=>{x.disabled=true;if(x.textContent===good)x.classList.add("ok")});
    if(!okk)b.classList.add("ko");else R.ok++;$("fb").textContent=okk?"Bravo !":"Presque : on lit « "+good+" ».";R.n++;
    setTimeout(ask,okk?900:2000)})}
$("back").onclick=()=>show("lvls");

/* ---- Navigation ---- */
function show(v){["lab","lvls","quiz"].forEach(x=>$(x).hidden=x!==v);if(v==="lvls")list();
  const l=v==="lab";$("t1").setAttribute("aria-selected",l);$("t2").setAttribute("aria-selected",!l)}
$("t1").onclick=()=>show("lab");$("t2").onclick=()=>show("lvls");
render();
</script></body></html>
